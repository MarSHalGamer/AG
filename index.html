<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM CRITICAL ERROR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000;
            color: #00ff00;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* خلفية الماتريكس المتحركة */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        /* الحاوية الرئيسية */
        .container {
            position: relative;
            z-index: 2;
            border: 2px solid #00ff00;
            padding: 40px;
            background: rgba(0, 0, 0, 0.85);
            box-shadow: 0 0 25px #00ff00;
            max-width: 90%;
            width: 600px;
        }

        /* جمجمة وشعار التهديد */
        .skull {
            font-size: 80px;
            text-shadow: 0 0 20px #00ff00;
            animation: blink 0.8s infinite alternate;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        /* تأثير Glitch للنص */
        .glitch {
            animation: glitch 1s infinite;
        }

        .status {
            color: #00ff00;
            font-size: 18px;
            margin-top: 20px;
            border-top: 1px dashed #00ff00;
            padding-top: 15px;
        }

        .details {
            font-size: 14px;
            color: #008800;
            margin-top: 10px;
            text-align: left;
            direction: ltr;
        }

        /* تحريك الوميض */
        @keyframes blink {
            0% { opacity: 1; text-shadow: 0 0 20px #00ff00; }
            100% { opacity: 0.3; text-shadow: 0 0 2px #00ff00; }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="container">
        <div class="skull">☠</div>
        <h1 class="glitch" id="main-text"></h1>
        
        <div class="status">
            <p>[!] SYSTEM ACCESS: DENIED</p>
            <p>[!] DATA ENCRYPTION: IN PROGRESS (100%)</p>
        </div>

        <div class="details" id="console"></div>
    </div>

    <script>
        // تأثير الماتريكس الخلفي
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "0101010101☠☠☠SYSTEM_HACKED_BY_AGENT_86☠☠☠";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff00";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // كتابة النص الرئيسي تلقائياً
        const mainText = "لقد تم تهكيرك عن طريق العميل 86";
        let index = 0;
        function typeWriter() {
            if (index < mainText.length) {
                document.getElementById("main-text").innerHTML += mainText.charAt(index);
                index++;
                setTimeout(typeWriter, 100);
            }
        }
        typeWriter();

        // طباعة سطور وهمية لإثبات الاختراق
        const logs = [
            "> Connecting to local device...",
            "> IP Address Captured: SUCCESS",
            "> Downloading private files...",
            "> Overriding system partition...",
            "> Agent 86 Control Secured."
        ];

        let logIndex = 0;
        function showLogs() {
            if (logIndex < logs.length) {
                const p = document.createElement("p");
                p.textContent = logs[logIndex];
                document.getElementById("console").appendChild(p);
                logIndex++;
                setTimeout(showLogs, 800);
            }
        }
        setTimeout(showLogs, 1500);
    </script>
</body>
</html>
