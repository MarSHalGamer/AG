<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Hacked</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .hacker-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.15; pointer-events: none;
            font-size: 14px; word-wrap: break-word;
        }
        .card {
            position: relative; z-index: 2;
            border: 2px solid #00ff00; padding: 40px;
            box-shadow: 0 0 20px #00ff00;
            background: rgba(0, 0, 0, 0.9); max-width: 80%;
        }
        h1 { font-size: 24px; margin: 0; text-shadow: 0 0 10px #00ff00; }

        /* مستطيل التنبيه المكرر */
        .hack-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            color: #00ff00;
            border: 3px solid #00ff00;
            box-shadow: 0 0 25px #00ff00;
            padding: 25px 40px;
            font-size: 22px;
            font-weight: bold;
            z-index: 9999;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="hacker-bg">
        01001000 01000001 01000011 01001011 01000101 01000100
        [SYSTEM OVERRIDE] [ACCESS GRANTED]
        01001000 01000001 01000011 01001011 01000101 01000100
    </div>

    <div class="card">
        <h1>لقد تم تهكيرك عن طريق الهكر عبد القادر احمد بن طرش</h1>
    </div>

    <!-- مستطيل التنبيه -->
    <div id="hackAlert" class="hack-box">تم تهكيرك</div>

    <script>
        // الخروج والتحويل لصفحة فارغة بعد 7 ثوانٍ
        setTimeout(function() {
            window.close();
            window.location.href = "about:blank";
        }, 7000);

        // وظيفة إظهار مستطيل "تم تهكيرك" لمدة 5 ثوانٍ
        function showHackBox() {
            let box = document.getElementById('hackAlert');
            box.style.display = 'block';
            
            setTimeout(function() {
                box.style.display = 'none';
            }, 5000); // يختفي بعد 5 ثوانٍ
        }

        // تكرار إظهار المستطيل كل 30 ثانية (نص دقيقة)
        setInterval(showHackBox, 30000);
    </script>

</body>
</html>
